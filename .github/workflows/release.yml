name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # VERSION always holds the version about to be released. If its tag
      # somehow already exists (e.g. a previous run's bump-back commit
      # failed after the release was published), keep bumping the patch
      # until an unused tag is found instead of failing.
      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force

          CUR="$(tr -d '[:space:]' < VERSION)"
          while git rev-parse "v${CUR}" >/dev/null 2>&1; do
            MAJOR_MINOR="${CUR%.*}"
            PATCH="${CUR##*.}"
            CUR="${MAJOR_MINOR}.$((PATCH + 1))"
          done

          MAJOR_MINOR="${CUR%.*}"
          PATCH="${CUR##*.}"
          NEXT="${MAJOR_MINOR}.$((PATCH + 1))"

          echo "Releasing v${CUR}, next will be ${NEXT}"
          echo "tag=v${CUR}" >> "$GITHUB_OUTPUT"
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build linux/amd64
        run: make build GOOS=linux GOARCH=amd64 VERSION=${{ steps.version.outputs.tag }}

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/composelock-linux-amd64.tar.gz -C bin composelock

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: dist/composelock-linux-amd64.tar.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.image }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT=${{ steps.version.outputs.sha }}
            DATE=${{ steps.version.outputs.date }}

      - name: Bump VERSION for next release
        run: |
          set -euo pipefail
          echo "${{ steps.version.outputs.next }}" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.version.outputs.next }} [skip ci]"
          git push origin HEAD:main
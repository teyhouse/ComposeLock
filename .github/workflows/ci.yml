name: CI

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "VERSION"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go tool staticcheck ./...

      - name: Test
        run: go test -race -shuffle=on ./...

      - name: Vulnerability check
        run: go tool govulncheck ./...

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # VERSION always holds the version about to be released. If its tag
      # somehow already exists (e.g. a previous run's bump-back commit
      # failed after the release was published), keep bumping the patch
      # until an unused tag is found instead of failing.
      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force

          CUR="$(tr -d '[:space:]' < VERSION)"
          while git rev-parse "v${CUR}" >/dev/null 2>&1; do
            MAJOR_MINOR="${CUR%.*}"
            PATCH="${CUR##*.}"
            CUR="${MAJOR_MINOR}.$((PATCH + 1))"
          done

          MAJOR_MINOR="${CUR%.*}"
          PATCH="${CUR##*.}"
          NEXT="${MAJOR_MINOR}.$((PATCH + 1))"

          echo "Releasing v${CUR}, next will be ${NEXT}"
          echo "tag=v${CUR}" >> "$GITHUB_OUTPUT"
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Build linux/amd64
        run: make build GOOS=linux GOARCH=amd64 VERSION=${{ steps.version.outputs.tag }}

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/composelock-linux-amd64.tar.gz -C bin composelock

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: dist/composelock-linux-amd64.tar.gz

      - name: Bump VERSION for next release
        run: |
          set -euo pipefail
          echo "${{ steps.version.outputs.next }}" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.version.outputs.next }} [skip ci]"
          git push origin HEAD:main
